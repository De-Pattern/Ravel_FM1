<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" font-family="Helvetica, Arial, sans-serif" role="img">
<title>SW 4>1 with four sources</title>
<desc>Four sources in blocks 3 to 6 in a row; SW 4>1 on block 7 with A on block 3 reads all four, one at a time; a TICK on block 1 into B steps it; its output goes to AUDIO.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#b8b8bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="390" rx="16" fill="#1b1b1d"/>
<rect x="28" y="30" width="194" height="262" rx="12" fill="none" stroke="#6a6a70" stroke-dasharray="4 4"/>
<g font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="middle">
<rect x="40" y="40" width="170" height="52" rx="8" fill="#163a32" stroke="#3fb58f"/><text x="125" y="62">Block 3: WAVE</text>
<rect x="40" y="102" width="170" height="52" rx="8" fill="#163a32" stroke="#3fb58f"/><text x="125" y="124">Block 4: WAVE</text>
<rect x="40" y="164" width="170" height="52" rx="8" fill="#163a32" stroke="#3fb58f"/><text x="125" y="186">Block 5: RING</text>
<rect x="40" y="226" width="170" height="52" rx="8" fill="#163a32" stroke="#3fb58f"/><text x="125" y="248">Block 6: STRING</text>
<rect x="290" y="124" width="160" height="88" rx="8" fill="#2c2850" stroke="#8f86e6"/><text x="370" y="150">Block 7: SW 4&gt;1</text>
<rect x="290" y="270" width="160" height="52" rx="8" fill="#2a2a2d" stroke="#6a6a70"/><text x="370" y="292">Block 1: TICK</text>
<rect x="500" y="142" width="140" height="52" rx="8" fill="#2a2a2d" stroke="#6a6a70"/><text x="570" y="164">AUDIO</text>
</g>
<g font-size="12" fill="#b8b8bc" text-anchor="middle">
<text x="125" y="80">a saw</text>
<text x="125" y="142">a square, an octave up</text>
<text x="125" y="204">a struck ring</text>
<text x="125" y="266">or noise, a filter…</text>
<text x="125" y="314">four blocks in a row</text>
<text x="370" y="172">A = block 3 (FROM)</text>
<text x="370" y="192">B = block 1 (STEP)</text>
<text x="370" y="310">each rise steps it</text>
<text x="570" y="182">the voice you hear</text>
<text x="340" y="360">A goes to the first of the four; the switch reads it and the next three</text>
</g>
<g stroke="#b8b8bc" stroke-width="1.5" marker-end="url(#a)">
<line x1="210" y1="66" x2="288" y2="144"/>
<line x1="210" y1="128" x2="288" y2="160"/>
<line x1="210" y1="190" x2="288" y2="176"/>
<line x1="210" y1="252" x2="288" y2="192"/>
<line x1="370" y1="270" x2="370" y2="214"/>
<line x1="450" y1="168" x2="498" y2="168"/>
</g>
</svg>
