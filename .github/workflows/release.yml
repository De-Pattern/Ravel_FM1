name: release

# Push a tag such as v0.2 to publish a release with the FM-1 firmware and the one-file emulator.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get install -y clang lld
          pip install pillow markdown
      - name: Build the WebAssembly emulator
        run: sh web/emu/build.sh
      - name: Smoke test
        run: node web/emu/test.mjs
      - name: One-file page
        run: python3 web/emu/bundle.py
      - name: The manual as a PDF
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          node tools/make_manual_pdf.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: emulator
          path: |
            build/web/ravel-emulator.html
            build/web/ravel-manual.pdf

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python packages (font generator)
        run: pip install pillow markdown
      - name: The AC79 SDK files, kept between runs
        uses: actions/cache@v4
        with:
          path: ~/ac79
          key: ac79-sdk-AC79NN_SDK_V1.2.1_2023-12-13
      - name: JieLi toolchain and the AC79 SDK files
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          sh tools/get_ac79_files.sh "$HOME/ac79"
      - name: Build, check and package
        run: |
          tag="${GITHUB_REF_NAME}"
          JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/ac79" python3 tools/build_fm1.py --release "${tag#v}"
      - name: Update-path tests against the package
        run: |
          mkdir -p build/fm1test
          cc -o build/fm1test/ota_test tests/fm1/ota_test.c && build/fm1test/ota_test build/fm1/Ravel-FM1.fwsc
          python3 tests/fm1/install_test.py
      - name: fm1-emu's build needs ALSA's headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev pkg-config
      - name: fm1-emu, built once and kept between runs
        uses: actions/cache@v4
        with:
          path: build/fm1-emu
          key: fm1-emu-9fa0215
      - name: Boots and plays in fm1-emu (as it is, with a flaky second core, with the FM-1's timing)
        run: FM1_EMU_REV=9fa0215 sh tools/emu_check.sh build/fm1/Ravel-FM1.fwsc build/fm1-emu
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/fm1/Ravel-FM1.fwsc
            build/fm1/report.json

  publish:
    needs: [emulator, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ravel-emulator.html ravel-manual.pdf Ravel-FM1.fwsc > SHA256SUMS.txt
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0                          # (the tags: the commits since the last one, when CHANGELOG.md has no section)
      - name: Release notes
        run: |
          repo="${{ github.server_url }}/${{ github.repository }}"
          pages="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          python3 src/tools/release_notes.py "${GITHUB_REF_NAME}" "$repo" "$pages" > notes.md
          cat notes.md
      - id: ver
        run: |
          echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in v0.*) echo "test=true" ;; *) echo "test=false" ;; esac >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: Ravel ${{ steps.ver.outputs.v }}${{ steps.ver.outputs.test == 'true' && ' (test build)' || '' }}
          prerelease: ${{ steps.ver.outputs.test }}       # a 0.x is a branch's test build: never the latest
          make_latest: ${{ steps.ver.outputs.test == 'true' && 'false' || 'true' }}
          body_path: notes.md
          files: |
            dist/Ravel-FM1.fwsc
            dist/ravel-emulator.html
            dist/ravel-manual.pdf
            dist/SHA256SUMS.txt
