name: autotag

# A release from a commit: when RELEASE (one line, a version such as 1.15.3) changes on main and that version
# has no tag yet, tag the commit vX.Y.Z, which starts the release workflow (release.yml). The tag is pushed
# with the RELEASE_TOKEN secret (a fine-grained token with Contents: read and write on this repository):
# a tag pushed with the workflow's own token would not start another workflow.
on:
  push:
    branches: [main, screen-reader]   # (screen-reader: a test build, a 0.x version)
    paths: [RELEASE]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: The token is there
        env:
          T: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::Add a RELEASE_TOKEN secret (Settings > Secrets and variables > Actions), then re-run this job"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - name: Tag it
        run: |
          v=$(tr -d ' \r\n' < RELEASE)
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::RELEASE holds '$v', not a version like 1.15.3"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged: nothing to do"
            exit 0
          fi
          git tag "v$v" "$GITHUB_SHA"
          git push origin "v$v"
          echo "tagged v$v at $GITHUB_SHA: the release workflow builds it"
